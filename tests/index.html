<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>a-select tests</title>
	<script type="module" src="tests.js"></script>
	<script type="module" src="test-results.min.js"></script>
	<link rel="stylesheet" href="test-results.css">
	<link rel="stylesheet" href="../extra/styles.css">
</head>
<body>
	<h1>a-select tests</h1>
	<test-results id="results"></test-results>

	<form id="form">
		<a-select id="test">
			<option>One</option>
			<option value="img">
				<img src="../extra/sample.jpg">
			</option>

			<option value="img-svg">
				<img src="../extra/address-book.svg">
			</option>

			<option selected value="svg">
				<svg height="35" width="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
				  <polygon points="50,5 80,45 95,60 60,75 70,100 50,70 30,100 40,75 5,60 20,45"/>
				</svg>
				svg
			</option>

			<optgroup label="Option Group">
				<img src="../extra/iguana.png">

				<option>Two</option>

				<option value="group-img">
					<img src="../extra/sample.jpg">
				</option>

				<option value="group-img-svg">
					<img src="../extra/address-book.svg">
				</option>

				<option value="group-svg">
					<svg height="35" width="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
					  <polygon points="50,5 80,45 95,60 60,75 70,100 50,70 30,100 40,75 5,60 20,45"/>
					</svg>
					svg
				</option>
			</optgroup>


			<option value="unicode">
				<b style="font-size:25px; line-height:1.2">☯</b>
			</option>
		</a-select>
	</form>

	<form id="other-form"></form>
</body>
</html>
