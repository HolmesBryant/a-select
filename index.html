<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>a-select custom element</title>
	<script type="module" src="src/a-select.js"></script>
	<script type="module" src="extra/a-bind.min.js"></script>
	<script type="module" src="extra/a-menu.min.js"></script>

	<link rel="stylesheet" href="extra/styles.css">
	<link rel="stylesheet" href="dist/a-select.css">
	<link rel="stylesheet" href="extra/a-menu.css">

	<style>
		a-bind { display: contents; }
	</style>
</head>
<body>
	<header>
		<h1>a-select custom element</h1>
		<strong>The description</strong>
		<p><a href="">Repo</a></p>

		<details id="readme">
			<summary>README</summary>
			<a-markdown file="README.md"></a-markdown>
		</details>
	</header>

	<!-- demo -->
	<section class="flex top space-between">
		<a-bindgroup model="dom:#demo" class="flex240">
			<a-menu
				open
				type="mobile"
				show-icon=""
				>
				<a-menu open group="demo-menu">
					<b slot="label">Attributes</b>
					<!-- active -->
					<div class="flex">
						<a-bind
							prop="active"
							elem-prop="checked">

							<input type="checkbox" id="demo-active">
						</a-bind>

						<label for="demo-active">
							active
						</label>
					</div>

					<!-- autofocus -->
			    <div class="flex">
			    	<a-bind
			    		prop="autofocus"
			    		elem-prop="checked">

				    	<input type="checkbox" id="demo-autofocus">
				    </a-bind>

			    	<label for="demo-autofocus">
			    		autofocus
			    	</label>
			    </div>

			    <!-- disabled -->
			    <div class="flex">
			    	<a-bind
			    		prop="disabled"
			    		elem-prop="checked">

			    		<input type="checkbox" id="demo-disabled">
			    	</a-bind>

			    	<label for="demo-disabled">
			    		disabled
			    	</label>
		    	</div>

		    	<!-- multiple -->
			    <div class="flex">
			    	<a-bind
			    		prop="multiple"
			    		elem-prop="checked">

				    	<input type="checkbox" id="demo-multiple">
				    </a-bind>

			    	<label for="demo-multiple">
			    		multiple
			    	</label>
			    </div>

			    <!-- required -->
			    <div class="flex">
			    	<a-bind
			    		prop="required"
			    		elem-prop="checked">

				    	<input type="checkbox" id="demo-required">
				    </a-bind>

			    	<label for="demo-required">
			    		required
			    	</label>
			    </div>

			    <!-- value -->
			    <div class="flex space-between">
			    	<label for="demo-value"> value </label>

			    	<a-bind prop="value">
				    	<input id="demo-value" list="demo-value-list">
				    </a-bind>

			    	<datalist id="demo-value-list">
			    	</datalist>

			    	<a-repeat target="dom:#demo-value-list" prop="values">
			    		<template>
			    			<option>{{item}}</option>
			    		</template>
			    	</a-repeat>
			    </div>

			    <!-- size -->
			    <div class="flex space-between">
			    	<label for="demo-size"> size </label>

			    	<a-bind prop="size">
				    	<input type="number" id="demo-size" step="1" min="0">
				    </a-bind>
			    </div>

			    <!-- name -->
			    <div class="flex space-between">
			    	<label for="demo-name"> name </label>

			    	<a-bind prop="name">
					    <input id="demo-name">
					  </a-bind>
			    </div>

			    <!-- form -->
			    <div class="flex column">
				    <div class="flex flex100 space-between">
				    	<label for="demo-form">form</label>

				    	<a-bind prop="form">
					    	<select id="demo-form">
					    		<option value="demo-form-one">Form One</option>
					    		<option value="demo-form-two">Form Two</option>
					    	</select>
					    </a-bind>
				    </div>

				  	<div id="demo-forms" class="flex">
							<form id="demo-form-one" name="Form One" onsubmit="logFormData(event)">
								<button>Form One</button>
							</form>

							<form id="demo-form-two" name="Form Two" onsubmit="logFormData(event)">
								<button>Form Two</button>
							</form>
						</div>
				  </div>
				</a-menu>

				<a-menu group="demo-menu">
					<b slot="label">Properties</b>
				</a-menu>

				<a-menu group="demo-menu">
					<b slot="label">CSS Variables</b>
				</a-menu>
			</a-menu>
		</a-bindgroup>

		<div class="flex flex1 column gap4">
			<!-- A-Select -->
			<a-select
				multiple
				id="demo"
				name="a-select-demo"
				value="svg-inline"
				form="demo-form-one">
				<option value="">Select...</option>

				<option>No Icon</option>

				<option>
					<img slot="icon" src="extra/sample.jpg">
					Image
				</option>

				<option disabled value="svg-url">
					<img src="extra/address-book.svg">
					Image(SVG)
				</option>

				<option value="svg-inline">
					<svg height="35" width="35" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
					  <polygon points="50,5 80,45 95,60 60,75 70,100 50,70 30,100 40,75 5,60 20,45"/>
					</svg>
					Inline SVG
				</option>

				<option value="unicode">
					<b style="font-size:25px; line-height:1.2">☯</b>
					Unicode Symbol
				</option>
			</a-select>

			<!-- form data -->
			<output id="demo-form-data"></output>
		</div>
	</section>

	<!-- examples -->
	<section>
		<h2>Examples</h2>

		<form onsubmit="logFormData(event)">
			<select required id="test" size="4">
				<option value="">Select...</option>
				<option>Aay</option>
				<option>Bee</option>
				<option>Sea</option>
				<option>Seb</option>
				<option>Sec</option>
				<option>Sed</option>
				<option>Sef</option>
				<option>Seg</option>
				<option>Seh</option>
				<option>Sei</option>
				<option>Sej</option>
				<option>Sek</option>
				<option>Sel</option>
				<option>Sem</option>
				<option>Sen</option>
				<option>Boom</option>
			</select>

			<select id="test" multiple disabled>
				<option>One</option>
				<option>Two</option>
				<option>Three</option>
			</select>

			<input id="ssgdg">
			<button>OK</button>
		</form>
	</section>

	<script>
		function logFormData(event) {
			event.preventDefault();
			let output = event.target.name;
			console.log(event.target.enries)
			// const data = new FormData(event.target);
			// const obj = Object.fromEntries(data);
			// const target = document.getElementById('demo-form-data');
			// output += "\n" + JSON.stringify(obj, null, 2);
			// target.value = output;
		}
	</script>
</body>
</html>
