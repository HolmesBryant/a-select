<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Foo</title>

	<script type="module" src="src/a-select.js"></script>
</head>
<body>
	<h1>Foo</h1>
	<a-select>
		<option value="">Select...</option>
		<option value="one"> One </option>
		<option>Two</option>
		<optgroup label="Group One">
			<img src="extra/sample.jpg">
			<option>Three</option>
			<option>Four</option>
		</optgroup>

		<optgroup label="Group Two">
			<img src="extra/sample.jpg">
			<option>Five</option>
			<option>Six</option>
		</optgroup>
	</a-select>

	<select>
		<option>One</option>
		<option>Two</option>
		<optgroup label="group">
			<option>Three</option>
			<option>Four</option>
		</optgroup>
	</select>
</body>
</html>
